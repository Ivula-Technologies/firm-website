name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check every PHP file
        run: |
          set -e
          find theme/cwm -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "All PHP files parse on PHP ${{ matrix.php }}"

  package:
    name: Build the theme zip
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the theme (folder cwm at the zip root)
        run: cd theme && zip -rq ../cwm-theme.zip cwm -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: cwm-theme
          path: cwm-theme.zip
          retention-days: 30
